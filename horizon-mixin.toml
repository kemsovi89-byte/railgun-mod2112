# Точки вшивания хелперов в игру. Формат — по образцу из документации
# (пример Playtime): по одному [[injection]] на хелпер.
# ВНИМАНИЕ: имена таргетов сверьте с актуальной документацией
# https://playhorizon.dev/docs/mod-code — раздел «Hook points and helpers».

[[injection]]
helper = "command"
hook = "native_command"

[[injection]]
helper = "tick"
hook = "native_tick"

[[injection]]
helper = "player"
hook = "native_player"
